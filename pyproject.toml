[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "runemap"
version = "0.1.0"
description = "Text radar map for agents — carve radar echoes into runes."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
authors = [{ name = "echorune" }]
keywords = ["weather", "radar", "ascii", "llm", "agents", "terminal"]
dependencies = ["numpy>=1.20"]

[project.optional-dependencies]
image = ["pillow>=8"]

[project.urls]
Homepage = "https://github.com/eirik-rune/runemap"

[tool.setuptools]
packages = ["runemap"]
