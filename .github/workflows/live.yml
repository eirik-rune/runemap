name: live weather render
on:
  schedule:
    - cron: '7,37 * * * *'   # every 30 min (offset to avoid top-of-hour congestion)
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: live-render
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: render 8 cities
        env:
          CAIYUN_TOKEN: ${{ secrets.CAIYUN_TOKEN }}
        run: python scripts/render_live.py
      - name: commit if changed
        run: |
          git config user.name "runemap-bot"
          git config user.email "310499736+eirik-rune@users.noreply.github.com"
          git add live/
          git diff --cached --quiet && echo "no change" && exit 0
          git commit -m "live: render $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
