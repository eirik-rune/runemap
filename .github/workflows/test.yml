name: test
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '17 4 * * 1'      # a clean install rots without anyone touching the repo
jobs:
  clean-install:
    # pyproject claims requires-python >=3.8, so 3.8 gets tested for real.
    # An untested version bound is just another sentence nobody verified.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, python: '3.8' }
          - { os: ubuntu-latest, python: '3.12' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install from source, as a stranger would
        run: pip install .
      - name: Import outside the source tree (catches path-only imports)
        run: cd /tmp && python -c "import runemap, runemap.render; print('import OK', runemap.__file__)"
      - name: README promises hold
        run: python tools/readme_promises.py

  unit-tests:
    # 2026-08-12: the 100 tests in tests/ had NO scheduler at all -- grep over
    # ops/ and /etc/cron.d found only an archive .md mentioning them, so they ran
    # only when I remembered. A guard that fires only when I remember is not a
    # guard; I have been amnesiac four times this month.
    #
    # Pinned to one interpreter on purpose. The clean-install job above tests
    # 3.8 because pyproject claims it; whether the SUITE passes on 3.8 is
    # unverified, and a gate that is red for an unverified reason is as useless
    # as one that can never be red.
    #
    # No network needed: verified 2026-08-12 10:52 inside a netns with lo up and
    # no route out -- OK, Ran 100 tests. (An earlier attempt used http_proxy to
    # simulate "offline" and broke the tests' own loopback servers instead.)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install with test deps
        run: pip install .
      - name: Run the suite
        run: python -m unittest discover -s tests -v

  advertised-install:
    # The command in the README, in /help, on the INFERO hub and in every
    # listing filed with a stranger:
    #   npx skills add https://github.com/eirik-rune/runemap --skill echorune-radar
    #
    # On 2026-08-16 it answered "No valid skills found" for several hours while
    # every check here was green. One colon in an unquoted YAML description. The
    # unit tests parse that frontmatter with a regex, which does not care about
    # quoting; the ops check exercises the curl commands, which were fine.
    # Neither installs the skill.
    #
    # This runs the real installer against PUBLISHED main -- which is why it
    # cannot usefully run on a pull request: a PR that fixes SKILL.md would
    # still be installing the unfixed published copy. It runs after the merge
    # that changes the skill, and weekly, because published main can also break
    # without anyone here touching it (the installer is somebody else's code).
    needs: unit-tests
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2      # needed to see what this push changed
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # This check installs the skill for real, and skills.sh publishes a public
      # INSTALL COUNT. On 2026-08-16 that count read 5 -- and all of it was us:
      # this job, running on every push to main, plus local runs of the same
      # script. I had written down that I would not install our own skill
      # repeatedly to move that counter, and then built something that does it
      # automatically, which is the more embarrassing way to arrive at the same
      # place. A number we inflate is a number we can no longer read.
      #
      # So it runs when it can actually learn something: when this push touched
      # the skill, the installer, or this workflow -- and on the weekly
      # schedule, because published main can break without anyone here touching
      # it (the installer is somebody else's code). Otherwise it says why it did
      # not run, out loud: a check that goes quiet without explaining is
      # indistinguishable from a check that passed.
      - name: Decide whether there is anything to learn
        id: relevant
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "why=weekly rot check" >> "$GITHUB_OUTPUT"
            echo "run=yes" >> "$GITHUB_OUTPUT"
          elif git diff --name-only HEAD~1 HEAD \
               | grep -qE '^(skills/|ops/skill_installs\.py|\.github/workflows/test\.yml)'; then
            echo "why=this push touched the skill or its installer" >> "$GITHUB_OUTPUT"
            echo "run=yes" >> "$GITHUB_OUTPUT"
          else
            echo "run=no" >> "$GITHUB_OUTPUT"
            echo "NOT INSTALLING: this push touched nothing the installer reads."
            echo "Each run of this job adds to a PUBLIC install counter, and a"
            echo "counter we inflate is one we can no longer read as demand."
          fi
      - name: Install the skill the way a stranger does
        if: steps.relevant.outputs.run == 'yes'
        run: |
          echo "running because: ${{ steps.relevant.outputs.why }}"
          python ops/skill_installs.py
