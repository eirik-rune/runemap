name: test
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '17 4 * * 1'      # a clean install rots without anyone touching the repo
jobs:
  clean-install:
    # pyproject claims requires-python >=3.8, so 3.8 gets tested for real.
    # An untested version bound is just another sentence nobody verified.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, python: '3.8' }
          - { os: ubuntu-latest, python: '3.12' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install from source, as a stranger would
        run: pip install .
      - name: Import outside the source tree (catches path-only imports)
        run: cd /tmp && python -c "import runemap, runemap.render; print('import OK', runemap.__file__)"
      - name: README promises hold
        run: python tools/readme_promises.py
